# Short W&B-logged sample run on 300 URBAN-SED clips per split.
#
#   uv run python scripts/data/prepare_urbansed.py --limit 300 \
#       --out data/processed/urbansed_sample
#   uv run python -m src.pipelines.train --config configs/crnn_sample.yaml
#
# This is for pipeline/W&B validation, not a paper result.

data_root: data/processed/urbansed_sample
train_split: train
val_split: validate
test_split: test
num_workers: 2
seed: 42

ckpt_dir: checkpoints
result_dir: results
run_name: crnn_sample_wandb

epochs: 6
batch_size: 32
accum_steps: 1
lr: 0.001
weight_decay: 0.001
warmup_steps: 20
grad_clip: 5.0
log_every: 5
eval_every: 1
ckpt_every: 2

arch:
  use_red: true
  use_epn: true
  epn_variant: single
  epn_hidden: 64
  epn_layers: 2
  cnn_channels: [16, 32, 64, 128]
  rnn_hidden: 128
  rnn_layers: 2
  dropout: 0.3

loss:
  lambda_ool: 100.0
  lambda_iou: 2.0
  focal_alpha: 2.0

eval:
  method: epn
  threshold: 0.3
  k: 15
  m: null
  min_duration: 0.0

lr_scheduler:
  type: warmup_cosine
  warmup_steps: 20
  start_epoch: 0
early_stopping:
  enabled: false
save_best: true
best_metric: psds1
best_mode: max

wandb:
  enabled: true
  project: epn-sed
  group: urbansed-sample
  entity: null
  monitor: psds1
  mode: max
  log_artifacts: true
