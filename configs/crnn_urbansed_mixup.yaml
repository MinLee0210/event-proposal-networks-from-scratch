# Extension: synthetic event mixing.
#
# With probability 0.5 per batch, two clips are combined by max-mixing their
# log-mels and taking the union of their presence/onset/offset targets. The
# resulting clip contains events from both sources, i.e. randomly added events.
# SpecAugment-style time/frequency masks are applied on top.

data_root: data/processed/urbansed
train_split: train
val_split: validate
test_split: test
num_workers: 8
seed: 42

ckpt_dir: checkpoints
result_dir: results
run_name: crnn_mixup_urbansed

epochs: 40
batch_size: 128
accum_steps: 1
lr: 0.001
weight_decay: 0.001
warmup_steps: 100
grad_clip: 5.0
amp: true
log_every: 20
eval_every: 2
ckpt_every: 10

arch:
  use_red: true
  use_epn: true
  epn_variant: single
  epn_hidden: 64
  epn_layers: 2
  cnn_channels: [16, 32, 64, 128]
  rnn_hidden: 128
  rnn_layers: 2
  dropout: 0.3

augment:
  mixup_prob: 0.5
  time_masks: 2
  time_width: 40
  freq_masks: 2
  freq_width: 8

loss:
  lambda_ool: 100.0
  lambda_iou: 0.5
  focal_alpha: 2.0

eval:
  method: epn
  threshold: 0.3
  k: 15
  m: null

lr_scheduler:
  type: warmup_cosine
  warmup_steps: 100
  start_epoch: 0
early_stopping:
  enabled: true
  monitor: psds1
  mode: max
  patience: 10
save_best: true
best_metric: psds1
best_mode: max

wandb:
  enabled: true
  project: epn-sed
  group: urbansed-crnn
  entity: null
  monitor: psds1
  mode: max
  log_artifacts: true
