# Extension: wider CRNN/EPN (more parameters).
#
# The default model is ~1.0M parameters. This variant uses 32/64/128/256 conv
# channels, a 256-wide BiGRU and a 128-wide EPN GRU (~4M parameters).

data_root: data/processed/urbansed
train_split: train
val_split: validate
test_split: test
num_workers: 8
seed: 42

ckpt_dir: checkpoints
result_dir: results
run_name: crnn_large100_urbansed

epochs: 100
batch_size: 64
accum_steps: 1
lr: 0.0008
weight_decay: 0.001
warmup_steps: 100
grad_clip: 5.0
amp: true
log_every: 20
eval_every: 2
ckpt_every: 10

arch:
  use_red: true
  use_epn: true
  epn_variant: single
  epn_hidden: 128
  epn_layers: 2
  cnn_channels: [32, 64, 128, 256]
  rnn_hidden: 256
  rnn_layers: 2
  dropout: 0.3

augment:
  mixup_prob: 0.0
  time_masks: 0
  time_width: 50
  freq_masks: 0
  freq_width: 8

loss:
  lambda_ool: 100.0
  lambda_iou: 0.5
  focal_alpha: 2.0

eval:
  method: epn
  threshold: 0.3
  k: 15
  m: null

lr_scheduler:
  type: warmup_cosine
  warmup_steps: 100
  start_epoch: 0
early_stopping:
  enabled: true
  monitor: psds1
  mode: max
  patience: 15
save_best: true
best_metric: psds1
best_mode: max

wandb:
  enabled: true
  project: epn-sed
  group: urbansed-improve
  entity: null
  monitor: psds1
  mode: max
  log_artifacts: true
